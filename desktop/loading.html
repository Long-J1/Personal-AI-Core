<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Personal AI 启动中</title>
<style>
  :root { --accent: #4f46e5; --muted: #6b7280; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: #f4f5f8; color: #1b1f2a;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  .logo { font-size: 46px; }
  h1 { font-size: 22px; margin: 0; }
  h1 small { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 8px; }
  #status { font-size: 14px; color: var(--muted); min-height: 20px; }
  .spin {
    width: 34px; height: 34px; border: 3px solid #dbe0ea;
    border-top-color: var(--accent); border-radius: 50%;
    animation: sp 0.9s linear infinite;
  }
  @keyframes sp { to { transform: rotate(360deg); } }
  .steps { font-size: 12px; color: #9aa1ad; margin-top: 6px; }
</style>
</head>
<body>
  <div class="logo">🧠</div>
  <h1>Personal AI <small>Core 启动中…</small></h1>
  <div class="spin"></div>
  <div id="status">正在准备…</div>
  <div class="steps">启动 Core → 健康检查 → 加载界面</div>
<script>
  const apply = (s) => { if (s && s.text) document.getElementById('status').textContent = s.text; };
  if (window.pai) {
    if (window.pai.onState) window.pai.onState(apply);
    // 补拉可能错过的状态（页面挂晚了）
    if (window.pai.getState) window.pai.getState().then(apply).catch(() => {});
  }
</script>
</body>
</html>
